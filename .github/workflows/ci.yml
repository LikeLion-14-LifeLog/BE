
name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lifelog
          POSTGRES_USER: lifelog
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lifelog -d lifelog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build
        env:
          DB_PASSWORD: test
          SPEC_PROFILE_TEST_DB_URL: jdbc:postgresql://localhost:5433/lifelog
          SPEC_PROFILE_TEST_DB_USER: lifelog
          SPEC_PROFILE_TEST_DB_PASSWORD: test
          CERTIFICATION_TEST_DB_URL: jdbc:postgresql://localhost:5433/lifelog
          CERTIFICATION_TEST_DB_USER: lifelog
          CERTIFICATION_TEST_DB_PASSWORD: test
          JWT_SECRET: "VGhpcy1pcy1hLXRlc3Qtb25seS1qd3Qtc2VjcmV0LWZvci1jaS0yMDI2IQ=="

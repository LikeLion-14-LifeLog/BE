services:
  postgres:
    image: postgres:17
    container_name: lifelog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lifelog
      POSTGRES_USER: lifelog
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - lifelog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifelog -d lifelog"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/likelion-14-lifelog/be:${IMAGE_TAG:-latest}
    container_name: lifelog-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/lifelog
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "8080:8080"

volumes:
  lifelog-postgres-data:

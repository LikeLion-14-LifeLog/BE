
spring:
  application:
    name: lifelog

  # 로컬에서 프로젝트 루트의 .env를 환경변수처럼 읽음 (없으면 무시)
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5433}/lifelog}
    username: lifelog
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000

# 서울 열린데이터광장 (키가 없으면 수집 API가 502)
seoul:
  openapi:
    key: ${SEOUL_OPENAPI_KEY:}
    base-url: http://openapi.seoul.go.kr:8088

job-posting:
  sync:
    scheduler:
      # 매일 1회 자동 수집, 기본 비활성화
      enabled: ${JOB_POSTING_SYNC_SCHEDULER_ENABLED:false}
      cron: "0 0 4 * * *"
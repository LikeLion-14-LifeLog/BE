
spring:
  application:
    name: lifelog

  # 로컬에서 프로젝트 루트의 .env를 환경변수처럼 읽음 (없으면 무시)
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5433}/lifelog}
    username: lifelog
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000

# 서울 열린데이터광장 (키가 없으면 수집 API가 502)
seoul:
  openapi:
    key: ${SEOUL_OPENAPI_KEY:}
    base-url: http://openapi.seoul.go.kr:8088

# 직무 기준 데이터 (한국고용직업분류 2025). 2018은 data/job_2018.csv로 참고용 보관
job:
  csv-path: data/job_2025.csv

# 일반 컬럼과 SPEC_HISTORY의 KECO는 2025 기준으로 전처리된 파일을 사용한다.
keep:
  salary:
    csv-path: ${KEEP_SALARY_CSV_PATH:classpath:data/KEEP2_YEARLY_SPEC_SALARY.csv}

openai:
  api-key: ${OPEN_API_KEY:}
  model: ${OPEN_API_MODEL:gpt-6.1-sol}
  base-url: https://api.openai.com/v1
  connect-timeout: 5s
  read-timeout: 60s
  max-attempts: 3
  max-input-chars: ${OPEN_API_MAX_INPUT_CHARS:200000}

job-posting:
  sync:
    scheduler:
      # 매일 1회 자동 수집, 기본 비활성화
      enabled: ${JOB_POSTING_SYNC_SCHEDULER_ENABLED:false}
      cron: "0 0 4 * * *"
  personalized:
    # 맞춤 공고에서 신입·경력무관 공고만 볼지 (기획 확인 전이라 기본 꺼짐)
    new-or-any-only: false

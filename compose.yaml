
services:
  postgres:
    image: postgres:17
    container_name: lifelog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lifelog
      POSTGRES_USER: lifelog
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - lifelog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifelog -d lifelog"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lifelog-postgres-data:

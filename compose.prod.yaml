services:
  postgres:
    image: postgres:17
    container_name: lifelog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lifelog
      POSTGRES_USER: lifelog
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - lifelog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifelog -d lifelog"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/likelion-14-lifelog/be:${IMAGE_TAG:-latest}
    container_name: lifelog-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/lifelog
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SEOUL_OPENAPI_KEY: ${SEOUL_OPENAPI_KEY:?Set SEOUL_OPENAPI_KEY in .env}
      # 채용공고 매일 새벽 4시 자동 수집 (.env에서 false로 끌 수 있음)
      JOB_POSTING_SYNC_SCHEDULER_ENABLED: ${JOB_POSTING_SYNC_SCHEDULER_ENABLED:-true}
      # 기본 힙(RAM의 25%)으로는 채용공고 수집 중 OOM이 나서 직접 지정
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx512m}
      OPEN_API_KEY: ${OPEN_API_KEY:-}
      OPEN_API_MODEL: ${OPEN_API_MODEL:-gpt-6.1-sol}
    # 서버에 직접 설치한 nginx가 80/443을 받아 여기로 프록시. 외부에는 공개하지 않음
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  lifelog-postgres-data:
